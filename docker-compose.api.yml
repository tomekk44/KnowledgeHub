version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: knowledgehub-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: knowledgehub-api
    working_dir: /app
    volumes:
      - ./src/KnowledgeHubApi:/app
    command: dotnet watch run --urls=http://0.0.0.0:5000
    environment:
      - Mongo__ConnectionString=mongodb://mongo:27017
      - Mongo__Database=knowledgehub
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5000:5000"
    depends_on:
      - mongo

volumes:
  mongo_data:
