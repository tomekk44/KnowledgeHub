version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: knowledgehub-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build: ./src/KnowledgeHubApi
    container_name: knowledgehub-api
    restart: always
    environment:
      - Mongo__ConnectionString=mongodb://mongo:27017
      - Mongo__Database=knowledgehub
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:5000
    ports:
      - "5000:5000"
    depends_on:
      - mongo

  web:
    build: ./src/KnowledgeHubWeb
    container_name: knowledgehub-web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  mongo_data:
